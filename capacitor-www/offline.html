<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0c10" />
    <title>Chain Dials · offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0c10;
        color: #f3efe6;
        font-family: system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100%;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .dial {
        width: 88px;
        height: 88px;
        margin: 0 auto 6px;
        border-radius: 50%;
        border: 2px solid #2a2f3a;
        position: relative;
      }
      .dial::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 12px;
        width: 2px;
        height: 32px;
        margin-left: -1px;
        background: #f7931a;
        transform-origin: 50% 32px;
        transform: rotate(-40deg);
        border-radius: 2px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        max-width: 300px;
        opacity: 0.65;
        font-size: 15px;
        line-height: 1.45;
      }
      button {
        justify-self: center;
        margin-top: 8px;
        min-height: 44px;
        padding: 0 26px;
        border: 0;
        border-radius: 999px;
        background: #f7931a;
        color: #0a0c10;
        font: 600 15px system-ui, -apple-system, sans-serif;
      }
      button:disabled {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dial" aria-hidden="true"></div>
      <h1>The dials can't reach the network</h1>
      <p>Chain Dials needs a connection for live chain data. Check Wi-Fi or mobile data, then try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var HOME = "https://chaindials.com";
      var retry = document.getElementById("retry");
      function go() {
        retry.disabled = true;
        retry.textContent = "Connecting…";
        location.replace(HOME);
      }
      retry.addEventListener("click", go);
      // Come back on our own once the device reports a connection again.
      window.addEventListener("online", go);
    </script>
  </body>
</html>
